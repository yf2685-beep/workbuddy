[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy-fit"
version = "0.1.0"
description = "Fashion review insights and evidence-based clothing fit prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "numpy>=1.26,<3", "scikit-learn>=1.7,<2", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "Pillow>=10.1,<12", "playwright>=1.45,<2"]

[project.scripts]
workbuddy = "workbuddy.cli:main"

[project.urls]
Repository = "https://github.com/yf2685-beep/workbuddy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbuddy = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
